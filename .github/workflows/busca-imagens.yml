name: Busca imagens dos links

on:
  push:
    paths:
      - "pedidos/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instala deps
        run: pip install requests pillow playwright

      - name: Instala chromium
        run: playwright install --with-deps chromium

      - name: Coleta dados reais dos produtos
        run: python ferramentas/coleta_dados.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Verifica e corrige pagina
        run: python ferramentas/verifica_pagina.py

      - name: Commit e push
        run: |
          git config user.name "vitrine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Produtos coletados automaticamente [skip ci]"
          git push
