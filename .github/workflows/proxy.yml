name: Proxy web (busca qualquer site)

on:
  push:
    paths:
      - "proxy/pedidos/**"
  workflow_dispatch:
    inputs:
      url:
        description: "URL a ser acessada"
        required: false
        type: string

permissions:
  contents: write

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias
        run: |
          pip install --quiet playwright
          python -m playwright install --with-deps chromium

      - name: Cria pedido (modo dispatch por URL)
        if: github.event_name == 'workflow_dispatch' && inputs.url != ''
        run: |
          id=$(date +%s)
          mkdir -p proxy/pedidos
          echo "${{ inputs.url }}" > "proxy/pedidos/${id}.txt"

      - name: Processa todos os pedidos pendentes
        run: |
          erro_total=0
          for pedido in proxy/pedidos/*.txt; do
            [ -e "$pedido" ] || continue
            id=$(basename "$pedido" .txt)
            saida="proxy/resultados/${id}.txt"
            if [ -e "$saida" ]; then
              echo "Ja processado: $id - remove pedido"
              rm -f "$pedido"
              continue
            fi
            echo "Processando pedido $id: $(cat "$pedido")"
            if python proxy/busca/busca_pagina.py "$(cat "$pedido")" "$saida"; then
              echo "OK: $id"
            else
              echo "FALHOU: $id"
              erro_total=1
            fi
            rm -f "$pedido"
          done

      - name: Commit resultados e remove pedidos processados
        run: |
          git config user.name "vitrine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add proxy/resultados proxy/pedidos
          git diff --cached --quiet || git commit -m "Resultados proxy [skip ci]"
          ok=""
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ]
