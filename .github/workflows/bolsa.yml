name: Bolsa maiores altas + screenshots

on:
  schedule:
    # dias úteis (1-5), a cada 30min entre 10h e 18h (America/Sao_Paulo)
    - cron: "30 13-21 * * 1-5"
    - cron: "0 13-21 * * 1-5"
  workflow_dispatch:
    inputs:
      chat_id:
        description: "Chat ID do Telegram (padrão: secret TELEGRAM_CHAT_ID)"
        required: false
        type: string
      apenas_texto:
        description: "Se true, envia só o relatório (sem fotos)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write

jobs:
  bolsa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instala dependencias
        run: |
          pip install --quiet playwright requests
          python -m playwright install --with-deps chromium

      - name: Roda coleta e envia ao Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ inputs.chat_id || secrets.TELEGRAM_CHAT_ID }}
        run: python bolsa/coleta_bolsa.py

      - name: Commit screenshots (arquivo)
        if: always()
        run: |
          git config user.name "vitrine-bot"
          git config user.email "bot@users.noreply.github.com"
          git add bolsa_out
          git diff --cached --quiet || git commit -m "Screenshot bolsa [skip ci]"
          ok=""
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep 10
          done
          [ -n "$ok" ]
